name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: creditflow
          # CI-only throwaway database; not a secret.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: creditflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creditflow -d creditflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://creditflow:ci-only-password@localhost:5432/creditflow_test
      TEST_DATABASE_URL: postgresql://creditflow:ci-only-password@localhost:5432/creditflow_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm --filter @creditflow/api test:integration

      - name: Build
        run: pnpm build
